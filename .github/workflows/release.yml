name: Release

on:
  push:
    branches:
      - production
    paths-ignore:
      - 'CHANGELOG.md'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Run composer audit
        run: composer audit --locked

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--no-scripts"

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --memory-limit=512M

  tests:
    name: Pest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--no-scripts"

      - name: Run Pest
        run: ./vendor/bin/pest --stop-on-failure

  release:
    name: Release
    needs: [composer-validate, composer-audit, phpstan, tests]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Generate changelog & bump version
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GIT_TOKEN }}
          git-user-name: 'github-actions[bot]'
          git-user-email: '41898282+github-actions[bot]@users.noreply.github.com'
          git-message: 'chore: update CHANGELOG for v{version}'
          config-file-path: '.github/conventional-changelog-config.js'
          input-file: 'CHANGELOG.md'
          output-file: 'CHANGELOG.md'
          skip-version-file: 'true'
          skip-on-empty: 'false'

      - name: Create GitHub release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          token: ${{ secrets.GIT_TOKEN }}
