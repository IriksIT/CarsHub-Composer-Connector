name: Release

on:
  push:
    branches:
      - production
    paths-ignore:
      - 'CHANGELOG.md'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Run composer audit
        run: composer audit --locked

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--no-scripts"

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --memory-limit=512M

  tests:
    name: Pest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--no-scripts"

      - name: Run Pest
        run: ./vendor/bin/pest --stop-on-failure

  release:
    name: Release
    needs: [composer-validate, composer-audit, phpstan, tests]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Bump version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          default_bump: patch
          release_branches: production
          custom_release_rules: "build:patch:Dependencies"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Sync to latest production before CHANGELOG commit
        run: |
          git fetch origin production
          git reset --hard origin/production

      - name: Update CHANGELOG
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ steps.tag.outputs.new_tag }}
          release-notes: ${{ steps.tag.outputs.changelog }}

      - name: Commit CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: production
          commit_message: "chore: update CHANGELOG for ${{ steps.tag.outputs.new_tag }}"
          file_pattern: CHANGELOG.md
