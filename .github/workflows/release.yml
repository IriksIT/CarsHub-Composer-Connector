name: Release

on:
  push:
    branches:
      - production
    paths-ignore:
      - 'CHANGELOG.md'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Bump version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          default_bump: patch
          release_branches: production
          custom_release_rules: "build:patch:Dependencies"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Sync to latest production before CHANGELOG commit
        run: |
          git fetch origin production
          git reset --hard origin/production

      - name: Update CHANGELOG
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ steps.tag.outputs.new_tag }}
          release-notes: ${{ steps.tag.outputs.changelog }}

      - name: Commit CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: production
          commit_message: "chore: update CHANGELOG for ${{ steps.tag.outputs.new_tag }}"
          file_pattern: CHANGELOG.md
