version: 53
jobs:
- name: Sync to GitHub
  steps:
  - !CheckoutStep
    name: checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - !CommandStep
    name: composer validate
    runInContainer: true
    runAs: '0:0'
    image: composer:2
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        composer validate --no-check-publish
    useTTY: false
    condition: SUCCESSFUL
  - !CommandStep
    name: composer audit
    runInContainer: true
    runAs: '0:0'
    image: composer:2
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        composer audit --locked
    useTTY: false
    condition: SUCCESSFUL
  - !CommandStep
    name: phpstan
    runInContainer: true
    runAs: '0:0'
    image: webdevops/php:8.4
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        composer install --no-interaction --prefer-dist
        ./vendor/bin/phpstan --error-format=github --memory-limit=512M
    useTTY: false
    condition: SUCCESSFUL
  - !CommandStep
    name: pest tests
    runInContainer: true
    runAs: '0:0'
    image: webdevops/php:8.4
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        composer install --no-interaction --prefer-dist
        ./vendor/bin/pest --stop-on-failure
    useTTY: false
    condition: SUCCESSFUL
  - !CommandStep
    name: push to GitHub
    runInContainer: true
    image: alpine/git:latest
    runAs: '0:0'
    interpreter: !PosixInterpreter
      shell: sh
      commands: |
        git fetch --quiet origin --tags
        git remote add github https://x-access-token:@secret:GITHUB_TOKEN@@@github.com/IriksIT/CarsHub-Composer-Connector.git
        git push github HEAD:production
        git push github --tags
    useTTY: false
    condition: SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: production
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
